[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "blockbuster"
dynamic = ["version"]
description = "A keyboard-driven terminal app for tracking movies and TV series you've watched."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Environment :: Console :: Curses",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/shadesdude66/Blockbuster"

[project.scripts]
blockbuster = "blockbuster.ui:main"

[tool.setuptools]
packages = ["blockbuster"]

[tool.setuptools.package-data]
blockbuster = ["CHANGELOG.md"]

[tool.setuptools.dynamic]
version = { attr = "blockbuster.__version__" }
